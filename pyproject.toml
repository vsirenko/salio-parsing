[project]
name = "products-api"
version = "0.1.0"
description = "Production-ready FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt>=2.8,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "pre-commit>=3.7",
    "commitizen>=3.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by Alembic — reviewed by hand, not restyled.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
# Conventional Commits: <type>(optional scope): <description>
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["app/core/config.py:app_version"]
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Eight workers, each on a database of its own (`app_test_gw0` …; see tests/conftest.py).
# `-n 0` runs in one process, for a debugger.
addopts = "-n 8"
