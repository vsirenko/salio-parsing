# Every push and pull request is checked; a push to main that passes is deployed.
# The deploy reads its secrets from the `production` environment — see deploy/README.md.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      # The suite runs on eight workers, each on a database of its own made from this one.
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # The lock, not the ranges: the image is built from requirements.lock, and what is
      # tested here is what runs there.
      - run: pip install -r requirements-dev.lock
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: migrations are complete
        run: |
          alembic upgrade head
          alembic check
      - name: the test database
        run: PGPASSWORD=app psql -h localhost -U app -d app -c "create database app_test"
      - name: tests
        run: pytest -q

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # One deploy at a time, and never cancelled halfway: a migration interrupted between
    # its statements is worse than a deploy that waits.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: the server's key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The application's settings live in the `PROD_ENV` secret, the whole .env in one: the
      # server's copy is written from it on every deploy, so a secret changes in one place
      # and a server rebuilt from nothing needs no file carried to it by hand.
      - name: the server's settings
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_AT: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          printf '%s\n' "$PROD_ENV" | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            "$USER_AT@$HOST" "umask 077 && cat > '$PATH_ON_SERVER/.env.next' && mv '$PATH_ON_SERVER/.env.next' '$PATH_ON_SERVER/.env'"
      - name: deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_AT: ${{ secrets.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "$USER_AT@$HOST" \
            "cd '$PATH_ON_SERVER' && git fetch --quiet origin && git reset --quiet --hard ${{ github.sha }} && deploy/deploy.sh ${{ github.sha }}"
