services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host ports are deliberately non-default: 5432 and 8000 are commonly taken by
      # other projects on a dev machine.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own step and exit. Keeping them out of the api start
  # command means several api replicas cannot race each other applying the same
  # migration.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The collection scheduler: same image, different command. Not a thread inside the api,
  # where it would be started once per uvicorn worker and die with whichever one held it.
  # Being the only one is enforced by a Postgres advisory lock, so scaling this service by
  # accident costs nothing — the extra copies exit immediately.
  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    command: ["python", "-m", "app.features.runs.scheduler"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
