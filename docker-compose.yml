services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host ports are deliberately non-default: 5432 and 8000 are commonly taken by
      # other projects on a dev machine.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own step and exit. Keeping them out of the api start
  # command means several api replicas cannot race each other applying the same
  # migration.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # A segfault in native code (uvloop, asyncpg, ssl) otherwise leaves only exit code
      # 139 and no line in the log. With this Python prints the stack it died in.
      PYTHONFAULTHANDLER: "1"
    ports:
      - "8080:8000"
    # It went down on 24.09.2026 with a segfault nobody could reproduce, and stayed down:
    # the panel was dead until someone noticed. Brought back instead, like the scheduler.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The collection scheduler: same image, different command. Not a thread inside the api,
  # where it would be started once per uvicorn worker and die with whichever one held it.
  # Being the only one is enforced by a Postgres advisory lock, so scaling this service by
  # accident costs nothing — the extra copies exit immediately.
  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # Workers it spawns reach the service by name inside the compose network, not
      # through the host port.
      API_BASE_URL: http://api:8000
      SNAPSHOT_DIR: /snapshots
      PYTHONFAULTHANDLER: "1"
    # The bytes a shop served, kept so a parser can be fixed against the page that broke
    # it. On a volume because a container's own disk goes away with it, and losing them
    # turns every parser fix back into a crawl.
    volumes:
      - snapshots:/snapshots
    command: ["python", "-m", "app.features.runs.scheduler"]
    # The image's check probes the api's HTTP port, which this process does not open, so it
    # read `unhealthy` whatever the scheduler did. This asks whether it ticked lately.
    healthcheck:
      test: ["CMD", "python", "-m", "app.features.runs.scheduler", "--healthy"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  pgdata:
  snapshots:
